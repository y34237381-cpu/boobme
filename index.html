<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My BabE</title>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Cinzel', sans-serif;
            background: #0a0e1a;
            color: #e8ddd0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .screen.active {
            display: flex;
        }

        /* ===== 首頁 ===== */
        #intro {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('bg_intro.jpg') center/cover no-repeat;
            position: relative;
        }
        #intro::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 14, 26, 0.45);
            pointer-events: none;
        }
        #intro>* {
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #f5edd6 0%, #c4b48a 50%, #8a7a5a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(180, 140, 80, 0.6), 0 4px 8px rgba(0, 0, 0, 0.8), 0 8px 16px rgba(0, 0, 0, 0.4);
            margin-bottom: 40px;
        }

        .btn-start {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 6px;
            padding: 18px 64px;
            border: 2px solid #d4c9a8;
            border-radius: 8px;
            background: linear-gradient(135deg, #2a2520, #1a1612);
            color: #d4c9a8;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .btn-start:hover {
            background: linear-gradient(135deg, #3d352e, #2a2520);
            box-shadow: 0 4px 40px rgba(180, 140, 80, 0.3), 0 0 60px rgba(180, 140, 80, 0.1);
            transform: scale(1.03);
            border-color: #f0e4c0;
        }

        /* ===== 角色選擇 ===== */
        #select {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('bg_intro.jpg') center/cover no-repeat;
            padding: 40px 20px;
            position: relative;
        }

        #select::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 14, 26, 0.5);
            pointer-events: none;
            z-index: 0;
        }

        .select-title {
            font-family: 'Cinzel', serif;
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #f0e4c0;
            margin-bottom: 50px;
            text-shadow: 0 0 40px rgba(180, 140, 80, 0.3), 0 4px 8px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        .char-grid {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .char-card {
            width: 200px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(180, 160, 130, 0.15);
            border-radius: 16px;
            padding: 20px 16px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s ease;
            backdrop-filter: blur(4px);
        }
        .char-card:hover {
            transform: translateY(-8px);
            border-color: rgba(180, 160, 130, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .char-card img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 50%;
            border: 2px solid rgba(180, 160, 130, 0.2);
            margin-bottom: 12px;
            background: #1a1a22;
        }

        .char-name {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 600;
            color: #f0e4c0;
            letter-spacing: 2px;
        }

        .char-feature {
            font-size: 14px;
            color: #b0a898;
            margin: 4px 0 6px;
        }

        .char-desc {
            font-size: 13px;
            color: #8a8078;
            line-height: 1.5;
            margin: 6px 0 10px;
            min-height: 40px;
        }

        .char-stars {
            color: #d4c9a8;
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* ===== 遊戲畫面 ===== */
        #game {
            flex-direction: column;
            background: #0a0e1a;
            position: relative;
        }

        .game-scene {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #0a0e1a;
            overflow: hidden;
        }

        /* ===== 手電筒遮罩 ===== */
        #lightMask {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                transparent 0%, 
                transparent 100px, 
                rgba(0,0,0,0.7) 180px, 
                rgba(0,0,0,0.92) 280px, 
                rgba(0,0,0,0.97) 100%
            );
            transition: background 0.08s ease;
        }

        /* ===== 可點擊物件 ===== */
        .clickable {
            position: absolute;
            cursor: pointer;
            z-index: 5;
            border: none;
            background: transparent;
            border-radius: 0;
            transition: none;
        }

        .clickable::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }

        .clickable:hover::after {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 0 24px rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%) scale(1.3);
        }

        .clickable-label {
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #d4c9a8;
            background: rgba(0, 0, 0, 0.75);
            padding: 2px 12px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .clickable:hover .clickable-label {
            opacity: 1;
        }

        /* 隱藏白色點點 */
        .clickable.no-dot::after {
            display: none !important;
            opacity: 0 !important;
            width: 0 !important;
            height: 0 !important;
        }

        /* 鑰匙特殊樣式 - 完全無互動視覺 */
        .clickable.key-item {
            cursor: default;
        }
        .clickable.key-item .clickable-label {
            display: none !important;
        }
        .clickable.key-item::after {
            display: none !important;
        }
        .clickable.key-item:hover::after {
            display: none !important;
        }

        /* ===== 彈窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: rgba(20, 18, 16, 0.95);
            border: 1px solid rgba(180, 160, 130, 0.25);
            border-radius: 20px;
            padding: 32px 40px;
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            overflow-y: auto;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .modal-box h3 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #f0e4c0;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        .modal-box p {
            font-size: 15px;
            line-height: 1.7;
            color: #c8bdb0;
            margin-bottom: 12px;
            text-align: left;
        }
        .modal-box img {
            max-width: 100%;
            max-height: 65vh;
            border-radius: 8px;
            margin: 12px auto;
            display: block;
            border: 1px solid rgba(180, 160, 130, 0.15);
            object-fit: contain;
        }
        .modal-box .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-box .btn-group .btn {
            padding: 10px 32px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .modal-box .btn-group .btn-yes {
            background: linear-gradient(135deg, #d4c9a8, #b8a888);
            color: #1a1612;
        }
        .modal-box .btn-group .btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(180, 140, 80, 0.3);
        }
        .modal-box .btn-group .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #b0a898;
            border: 1px solid rgba(180, 160, 130, 0.2);
        }
        .modal-box .btn-group .btn-no:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .modal-box .btn-group .btn-close {
            background: rgba(180, 60, 60, 0.2);
            color: #e8a0a0;
            border: 1px solid rgba(180, 60, 60, 0.2);
        }
        .modal-box .btn-group .btn-close:hover {
            background: rgba(180, 60, 60, 0.3);
        }

        /* 密碼鎖 */
        .password-lock {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 16px 0 20px;
        }
        .password-slot {
            width: 48px;
            height: 56px;
            border-bottom: 3px solid rgba(180, 160, 130, 0.4);
            font-size: 32px;
            color: #f0e4c0;
            text-align: center;
            line-height: 56px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            transition: border-color 0.3s;
        }
        .password-slot.filled {
            border-bottom-color: #d4c9a8;
            text-shadow: 0 0 20px rgba(180, 140, 80, 0.2);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 220px;
            margin: 0 auto 8px;
        }
        .numpad-btn {
            padding: 12px 0;
            font-size: 22px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #e8ddd0;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Courier New', monospace;
        }
        .numpad-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.04);
        }
        .numpad-btn.confirm {
            background: rgba(180, 140, 80, 0.25);
            border-color: rgba(180, 140, 80, 0.3);
            color: #f0e4c0;
        }
        .numpad-btn.confirm:hover {
            background: rgba(180, 140, 80, 0.35);
        }
        .numpad-btn.clear {
            background: rgba(180, 60, 60, 0.15);
            border-color: rgba(180, 60, 60, 0.15);
            color: #e8a0a0;
        }
        .numpad-btn.clear:hover {
            background: rgba(180, 60, 60, 0.25);
        }

        /* 計時器 */
        .timer {
            font-family: 'Courier New', monospace;
            font-size: 40px;
            font-weight: 700;
            color: #f0e4c0;
            text-shadow: 0 0 30px rgba(180, 140, 80, 0.15);
            letter-spacing: 4px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(180, 160, 130, 0.1);
            display: inline-block;
            margin-bottom: 12px;
        }
        .timer.warning {
            color: #f0a070;
            animation: timerPulse 0.8s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .choice-group {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .choice-btn {
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .choice-btn:hover {
            transform: scale(1.05);
        }
        .choice-light {
            background: linear-gradient(135deg, #f5b042, #d4872a);
            color: #1a1612;
            box-shadow: 0 0 40px rgba(212, 135, 42, 0.2);
        }
        .choice-light:hover {
            box-shadow: 0 0 60px rgba(212, 135, 42, 0.4);
        }
        .choice-dark {
            background: linear-gradient(135deg, #4a6a8a, #2a3a5a);
            color: #e8ddd0;
            box-shadow: 0 0 40px rgba(74, 106, 138, 0.15);
        }
        .choice-dark:hover {
            box-shadow: 0 0 60px rgba(74, 106, 138, 0.3);
        }

        /* 鈴鐺警告 */
        .bell-warning {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(180, 60, 30, 0.15);
            border: 1px solid rgba(180, 60, 30, 0.2);
            border-radius: 10px;
            margin: 8px 0 16px;
            justify-content: center;
            animation: bellShake 0.5s ease-in-out;
        }
        .bell-warning .bell-icon {
            font-size: 28px;
        }
        .bell-warning .bell-text {
            font-size: 14px;
            color: #f0a070;
        }
        @keyframes bellShake {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-8deg);
            }
            75% {
                transform: rotate(8deg);
            }
        }

        .ending-text {
            font-size: 18px;
            line-height: 2;
            color: #d4c9a8;
            text-align: left;
            padding: 8px 0;
            white-space: pre-wrap;
        }

        .scene-nav {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s, transform 0.3s;
        }
        .scene-nav:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* 日記翻頁專用按鈕 */
        .page-nav-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .page-nav-group .btn {
            padding: 10px 28px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 820px) {
            .game-title {
                font-size: 40px;
                letter-spacing: 4px;
            }
            .btn-start {
                font-size: 20px;
                padding: 14px 40px;
            }
            .char-grid {
                gap: 16px;
            }
            .char-card {
                width: 150px;
                padding: 14px 10px 18px;
            }
            .char-card img {
                width: 100px;
                height: 100px;
            }
            .char-name {
                font-size: 16px;
            }
            .select-title {
                font-size: 26px;
            }
            .modal-box {
                padding: 24px 20px;
                max-width: 95vw;
                max-height: 92vh;
            }
            .modal-box img {
                max-height: 50vh;
            }
            .password-slot {
                width: 36px;
                height: 44px;
                font-size: 24px;
                line-height: 44px;
            }
            .numpad {
                max-width: 180px;
            }
            .numpad-btn {
                padding: 10px 0;
                font-size: 18px;
            }
            .choice-btn {
                padding: 12px 24px;
                font-size: 16px;
            }
            .timer {
                font-size: 30px;
                padding: 6px 16px;
            }
            .clickable-label {
                font-size: 10px;
                bottom: -22px;
                padding: 1px 8px;
            }
            .clickable::after {
                width: 8px;
                height: 8px;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 28px;
                letter-spacing: 2px;
            }
            .btn-start {
                font-size: 16px;
                padding: 12px 28px;
                letter-spacing: 3px;
            }
            .char-card {
                width: 130px;
                padding: 10px 8px 14px;
            }
            .char-card img {
                width: 80px;
                height: 80px;
            }
            .char-name {
                font-size: 14px;
            }
            .char-desc {
                font-size: 11px;
                min-height: 30px;
            }
            .select-title {
                font-size: 20px;
                margin-bottom: 20px;
            }
            .char-grid {
                gap: 10px;
            }
            .modal-box h3 {
                font-size: 18px;
            }
            .modal-box p {
                font-size: 13px;
            }
            .modal-box img {
                max-height: 40vh;
            }
            .password-slot {
                width: 30px;
                height: 38px;
                font-size: 20px;
                line-height: 38px;
            }
            .numpad {
                max-width: 150px;
                gap: 6px;
            }
            .numpad-btn {
                padding: 8px 0;
                font-size: 16px;
            }
            .clickable-label {
                font-size: 9px;
                bottom: -18px;
                padding: 1px 6px;
            }
            .clickable::after {
                width: 6px;
                height: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 首頁 ===== -->
    <div id="intro" class="screen active">
        <div class="game-title">Be My BabE</div>
        <button class="btn-start" onclick="showSelect()">開始遊戲</button>
    </div>

    <!-- ===== 角色選擇 ===== -->
    <div id="select" class="screen">
        <div class="select-title">選擇你的角色</div>
        <div class="char-grid" id="charGrid"></div>
    </div>

    <!-- ===== 遊戲畫面 ===== -->
    <div id="game" class="screen">
        <div class="game-scene" id="gameScene">
            <div id="lightMask"></div>
        </div>
    </div>

    <!-- ===== 彈窗 ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box" id="modalBox">
            <div id="modalContent"></div>
        </div>
    </div>


    <script>
        // ============================================================
        //  資料定義
        // ============================================================

        const CHARACTERS = {
            Astrid: {
                id: 'Astrid',
                name: '艾絲特',
                feature: '橘紅頭髮',
                desc: '活潑開朗，半夜肚子餓絕對忍不住。直覺敏銳，總能在混亂中找到出路。',
                stars: '★★★★',
                img: 'char_Astrid.jpg'
            },
            Elias: {
                id: 'Elias',
                name: '艾利亞斯',
                feature: '綠色眼睛',
                desc: '自信驕傲，觀察力驚人。手機手電筒壞了讓他有點煩躁——但不會承認。',
                stars: '★★★',
                img: 'char_Elias.jpg'
            },
            Freya: {
                id: 'Freya',
                name: '芙蕾雅',
                feature: '白皙肌膚',
                desc: '話不多，冷靜沉著，用行動代替言語。膚色在月光下像會發光。',
                stars: '★★',
                img: 'char_Freya.jpg'
            },
            Lukas: {
                id: 'Lukas',
                name: '盧卡斯',
                feature: '修長雙腿',
                desc: '團隊中的行動派，體能最好，總是第一個站出來保護大家。',
                stars: '★',
                img: 'char_Lukas.jpg'
            }
        };

        // ============================================================
        //  場景配置（所有物件大小統一縮小）
        // ============================================================

        const ROOM_CONFIG = {
            Astrid: {
                background: 'room_bedroom.jpg',
                items: [
                    { id: 'wardrobe', label: '衣櫃', x: 15, y: 40, w: 20, h: 20, action: 'wardrobe' },
                    { id: 'desk', label: '抽屜', x: 80, y: 75, w: 20, h: 20, action: 'desk' },
                    { id: 'notebook', label: '日記', x: 58, y: 25, w: 20, h: 20, action: 'notebook' },
                    { id: 'generator1', label: '發電機', x: 12, y: 0, w: 20, h: 20, action: 'generator1' },
                    { id: 'bell', label: '鈴鐺', x: 84, y: 16, w: 20, h: 20, action: 'bell' },
                ]
            },
            Elias: {
                background: 'room_bathroom.jpg',
                items: [
                    { id: 'towel', label: '浴巾', x: 32, y: 45, w: 25, h: 20, action: 'towel' },
                    { id: 'bell_elias', label: '鈴鐺', x: 83, y: 47, w: 20, h: 20, action: 'bell' },
                    { id: 'door_out', label: '浴室門', x: 33, y: 80, w: 20, h: 20, action: 'door_out' },

        // ============================================================

        const $ = id => document.getElementById(id);

        // ============================================================

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));

        }

        function showSelect() {
            showScreen('select');

            charGrid.innerHTML = '';

                const card = document.createElement('div');
                card.className = 'char-card';
                card.innerHTML = `
                    <img src="${ch.img}" alt="${ch.name}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22140%22%3E%3Crect width=%22140%22 height=%22140%22 fill=%22%23222%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-size=%2220%22%3E${ch.name}%3C/text%3E%3C/svg%3E'">

        // ============================================================
        //  遊戲啟動
        // ============================================================

        function startGame(charId) {
            state.character = charId;
            state.notebookUnlocked = false;
            state.cabinetUnlocked = false;
            state.surgeryNoteUnlocked = false;
            state.storehouseUnlocked = false;
            state.generatorUnlocked = false;
            state.hasBell = false;
            state.hasKey = false;
            state.hasCandle = false;
            state.timer = 600;
            state.timerRunning = false;
            state.gameEnded = false;
            state.finalChoice = null;
            state.hasCloth = false;
            state.clothType = '';
            state.sceneHistory = [];
            state.notebookPage = 0;

            if (charId === 'Astrid') state.scene = 'Astrid';
            else if (charId === 'Elias') state.scene = 'Elias';
            else if (charId === 'Freya') state.scene = 'Freya';
            else if (charId === 'Lukas') state.scene = 'Lukas';

            showScreen('game');
            renderScene();
            showOpeningStory(charId);

            showScreen('game');
            renderScene();
            showOpeningStory(charId);
            
            // ===== 啟動總計時器（30分鐘） =====
            state.totalTimer = 1500;
            state.totalTimerRunning = true;
            if (state.totalTimerInterval) clearInterval(state.totalTimerInterval);
            state.totalTimerInterval = setInterval(function() {
                state.totalTimer--;
                updateTotalTimerDisplay();
                if (state.totalTimer <= 0) {
                    clearInterval(state.totalTimerInterval);
                    state.totalTimerRunning = false;
                    showEnding('bad', '時間到了……你沒能及時逃出。');
                }
            }, 1000);
        }

        function updateTotalTimerDisplay() {
            // 移除舊的計時器顯示
            const oldTimer = document.getElementById('totalTimerDisplay');
            if (oldTimer) oldTimer.remove();
            
            // 只在遊戲畫面顯示
            if (!document.getElementById('game').classList.contains('active')) return;
            
            const mins = Math.floor(state.totalTimer / 60);
            const secs = state.totalTimer % 60;
            const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            const timerEl = document.createElement('div');
            timerEl.id = 'totalTimerDisplay';
            timerEl.style.cssText = `
                position: absolute;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 15;
                font-family: 'Courier New', monospace;
                font-size: 32px;
                font-weight: 700;
                color: #f0e4c0;
                text-shadow: 0 0 30px rgba(180, 140, 80, 0.15);
                letter-spacing: 4px;
                padding: 8px 20px;
                background: rgba(0, 0, 0, 0.5);
                border-radius: 10px;
                border: 1px solid rgba(180, 160, 130, 0.1);
                pointer-events: none;
            `;
            timerEl.textContent = `⏱ ${timeStr}`;
            
            // 時間少於5分鐘時變色警告
            if (state.totalTimer <= 600) {
                timerEl.style.color = '#f0a070';
                timerEl.style.animation = 'timerPulse 0.8s ease-in-out infinite';
            }
            
            document.getElementById('gameScene').appendChild(timerEl);
        }

        // 手電筒追蹤滑鼠
        function initLightMask() {
            const gameScene = document.getElementById('gameScene');
            const lightMask = document.getElementById('lightMask');
            
            if (!gameScene || !lightMask) return;
            
            // 如果場景是浴室，不啟動手電筒
            if (state.scene === 'Elias') {
                lightMask.style.display = 'none';
                return;
            }
            
            // 如果是艾利亞斯的客廳且還沒有蠟燭，不啟動手電筒
            if (state.scene === 'EliasLiving' && !state.hasCandle) {
                lightMask.style.display = 'block';
                lightMask.style.background = 'rgba(0,0,0,0.95)';
                return;
            }
            
            // 其他情況：正常手電筒
            lightMask.style.display = 'block';
            lightMask.style.background = ''; // 重置為 CSS 樣式
            
            gameScene.removeEventListener('mousemove', lightMask._handler);
            
            const handler = function(e) {
                const rect = gameScene.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                lightMask.style.setProperty('--mouse-x', x + '%');
                lightMask.style.setProperty('--mouse-y', y + '%');
            };
            
            lightMask._handler = handler;
            gameScene.addEventListener('mousemove', handler);
        }

        function getSceneConfig(sceneKey) {
            return ROOM_CONFIG[sceneKey] || null;
        }

        function getCurrentConfig() {
            return getSceneConfig(state.scene);
        }

        // ============================================================
        //  開場劇情
        // ============================================================

        function showOpeningStory(charId) {
            const commonIntro = `你們四個人——芙蕾雅、艾絲特、艾利亞斯、盧卡斯——總是會在半夜走同一條隧道去觀星。

        但今晚，隧道被雪崩封住了。你們下車查看許久，發現真的無法通行。想說算了，正要回頭時，才發現輪胎也拋錨了。

        正當煩惱怎麼辦，突然有人跳出來解救你們。他自稱是住在附近山裡的木屋主人，名叫埃里克．哈爾沃森（Erik Halvorsen），說可以讓你們借住一晚。你們很感激地入住了。

        到達他家後，主人稍微交代事情，就回房間休息了。本來大家也打算回房間安頓，但芙蕾雅真的太餓了，決定去廚房覓食。艾絲特、艾利亞斯、盧卡斯則留在房間準備洗澡。

        艾利亞斯去洗澡時發現熱水器壞掉，盧卡斯就前往了地下室維修。艾絲特則留在房間先休息。

        突然……燈就暗掉了。

        在陌生環境伸手不見五指，你們也不敢隨便動彈。首要目標，是先找到能夠作為光源的設備。`;

            const charSpecific = {
                Astrid: `\n\n妳待在房間裡，四周一片漆黑。\n妳記得床頭好像有東西……先摸黑找找看吧。`,

                Elias: `\n\n你人在浴室，這裡的燈還是亮的——但外面一片漆黑。\n你拿出手機想開手電筒——螢幕閃了兩下，然後徹底黑了。\n「……手機壞了。」\n你決定先看看浴室裡有什麼能用的，再出去探索。`,

                Freya: `\n\n你人在廚房，手機手電筒還能用。\n你打開手機，照亮了周圍——廚房裡似乎有些不太對勁的東西。`,

                Lukas: `\n\n你人在地下室，手機手電筒還能用。\n你打開手機，照亮了周圍——地下室很大，盡頭有一扇鎖住的木門。`
            };

            const fullStory = commonIntro + (charSpecific[charId] || '');

            showModal(`
                <h3>前情提要</h3>
                <p style="white-space:pre-wrap;font-size:15px;line-height:1.9;text-align:left;color:#d4c9a8;">${fullStory}</p>
                <div class="btn-group"><button class="btn btn-yes" onclick="closeModal();startExploration()">開始探索</button></div>
            `);
        }

        function startExploration() {
            renderScene();
            initLightMask();
        }

        // ============================================================
        //  場景渲染
        // ============================================================

        function renderScene() {
            const cfg = getCurrentConfig();
            if (!cfg) return;

            gameScene.style.backgroundImage = `url('${cfg.background}')`;
            gameScene.style.backgroundSize = 'cover';
            gameScene.style.backgroundPosition = 'center';

            document.querySelectorAll('.clickable').forEach(el => el.remove());
            document.querySelectorAll('.scene-nav').forEach(el => el.remove());

            const rect = gameScene.getBoundingClientRect();
            const w = rect.width || window.innerWidth;
            const h = rect.height || window.innerHeight;

            cfg.items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'clickable';
                
                // ===== 判斷是否為紙條或櫃子（在遮罩上方） =====
                if (item.action === 'hint_paper' || item.action === 'cabinet') {
                    el.style.zIndex = '5';  // 在遮罩上方
                } else {
                    el.style.zIndex = '2';  // 在遮罩下方
                }
                // ===== 結束 =====
                
                // 縮小點擊範圍（只留白色點點周圍）
                const scale = 0.35;
                const originalW = item.w / 100 * w;
                const originalH = item.h / 100 * h;
                const scaledW = originalW * scale;
                const scaledH = originalH * scale;
                const centerX = (item.x / 100 * w) + originalW / 2;
                const centerY = (item.y / 100 * h) + originalH / 2;
                
                el.style.left = (centerX - scaledW / 2) + 'px';
                el.style.top = (centerY - scaledH / 2) + 'px';
                el.style.width = scaledW + 'px';
                el.style.height = scaledH + 'px';
                
                el.dataset.action = item.action;
                
                // 如果 noDot 為 true，隱藏白色點點
                if (item.noDot) {
                    el.classList.add('no-dot');
                }
                
                el.innerHTML = `<span class="clickable-label">${item.label}</span>`;
                el.onclick = () => handleClick(item.action);

                // 艾利亞斯客廳拿到蠟燭前，只顯示紙條和櫃子
                if (state.scene === 'EliasLiving' && !state.hasCandle) {
                    if (item.action !== 'hint_paper' && item.action !== 'cabinet') {
                        el.style.display = 'none';
                    }
                }

                gameScene.appendChild(el);
            });

            // ===== 獨立渲染鑰匙（在黑色遮罩下方） =====
            if (state.scene === 'Astrid' && !state.hasKey) {
                const keyEl = document.createElement('div');
                keyEl.style.cssText = `
                    position: absolute;
                    left: 5%;
                    top:55%;
                    width: 15px;
                    height: 15px;
                    font-size: 20px;
                    cursor: pointer;
                    z-index: 2;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    pointer-events: auto;
                    user-select: none;
                `;
                keyEl.textContent = '🔑';
                keyEl.onclick = () => handleClick('key');
                keyEl.id = 'keyIcon';
                gameScene.appendChild(keyEl);
            }

            // 返回按鈕
            const backBtn = document.createElement('div');
            backBtn.className = 'scene-nav';
            backBtn.style.cssText =
                'position:absolute;top:20px;left:20px;z-index:10;cursor:pointer;opacity:0.5;transition:opacity 0.3s;';
            backBtn.innerHTML = `
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <rect x="2" y="2" width="36" height="36" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
                    <path d="M22 14 L14 20 L22 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
            backBtn.onmouseenter = () => backBtn.style.opacity = '1';
            backBtn.onmouseleave = () => backBtn.style.opacity = '0.5';
            backBtn.onclick = () => {
                if (state.sceneHistory.length > 0) {
                    const prev = state.sceneHistory.pop();
                    state.scene = prev;
                    renderScene();
                } else {
                    if (confirm('確定要退出遊戲嗎？進度將遺失。')) {
                        showScreen('select');
                    }
                }
            };
            gameScene.appendChild(backBtn);

            // ============================================================
            //  手電筒遮罩控制（根據場景）
            // ============================================================
            const lightMask = document.getElementById('lightMask');
            const sceneKey = state.scene;

            // 如果 lightMask 不存在，直接跳過
            if (!lightMask) return;

            // === 浴室（原本就是亮的）：沒有遮罩 ===
            if (sceneKey === 'Elias') {
                lightMask.style.display = 'none';
                gameScene.removeEventListener('mousemove', lightMask._handler);
            }
            // === 艾利亞斯的客廳 ===
            else if (sceneKey === 'EliasLiving') {
                if (state.hasCandle) {
                    // 拿到蠟燭後：顯示手電筒
                    lightMask.style.display = 'block';
                    lightMask.style.background = ''; // 重置為 CSS 預設
                    initLightMask();
                } else {
                    // 還沒拿到蠟燭：全黑，無手電筒
                    lightMask.style.display = 'block';
                    lightMask.style.background = 'rgba(0,0,0,0.95)';
                    gameScene.removeEventListener('mousemove', lightMask._handler);
                }
            }
            // === 大門場景 ===
            else if (sceneKey === 'door') {
                lightMask.style.display = 'block';
                lightMask.style.background = '';
                initLightMask();
            }
            // === 其他場景（艾絲特房間、廚房、地下室）：有手電筒 ===
            else {
                lightMask.style.display = 'block';
                lightMask.style.background = ''; // 重置為 CSS 預設
                initLightMask();
            }

            // 更新總計時器顯示
            if (state.totalTimerRunning) {
                updateTotalTimerDisplay();
            }
        }

        // ============================================================
        //  點擊處理
        // ============================================================

        function handleClick(action) {
            if (state.gameEnded) return;

            switch (action) {
                // ===== 鑰匙 =====

                            <button class="btn btn-no" onclick="closeModal()">先不拿</button>

                // ===== 鈴鐺（共通） =====

                    showModal(`

                            <button class="btn btn-yes" onclick="takeBell()">拿</button>

                    `);
                    break;

                    // ===== 艾絲特 =====
                    case 'wardrobe':
                        if (state.wardrobeUnlocked) {
                            if (state.hasCloth && state.clothType === '床單') {
                                showModal(`<h3>衣櫃</h3><p>你已經拿過床單了。</p><div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">知道了</button></div>`);
                                return;

                            showModal(`

                                <img src="item_sheet.png" alt="床單" onerror="this.style.display='none'">
                                <p>衣櫃裡有一條摺好的白色床單。</p>
                                <div class="btn-group">
                                    <button class="btn btn-yes" onclick="takeSheet()">拿</button>
                                    <button class="btn btn-no" onclick="closeModal()">先不拿</button>
                                </div>
                            `);
                            return;
                        }
                        showModal(`
                            <h3>衣櫃</h3>
                            <img src="obj_wardrobe.jpg" alt="衣櫃" onerror="this.style.display='none'">
                            <p>一個上鎖的衣櫃，需要四位數密碼。</p>
                            <div style="margin:12px 0;">
                                <div class="password-lock" id="wardrobeLock">
                                    <div class="password-slot" data-idx="0"></div>
                                    <div class="password-slot" data-idx="1"></div>
                                    <div class="password-slot" data-idx="2"></div>
                                    <div class="password-slot" data-idx="3"></div>
                                </div>
                                <div class="numpad" id="wardrobeNumpad"></div>
                            </div>
                            <div class="btn-group">
                                <button class="btn btn-close" onclick="closeModal()">取消</button>
                            </div>
                        `);
                        setTimeout(function() {
                            initPasswordLock('wardrobeLock', 'wardrobeNumpad', '2981', function() {
                                state.wardrobeUnlocked = true;
                                closeModal();
                                showModal(`
                                    <h3>衣櫃打開了</h3>
                                    <img src="item_sheet.png" alt="床單" onerror="this.style.display='none'">
                                    <p>衣櫃裡有一條摺好的白色床單。</p>
                                    <div class="btn-group">
                                        <button class="btn btn-yes" onclick="takeSheet()">拿</button>
                                        <button class="btn btn-no" onclick="closeModal()">先不拿</button>
                                    </div>
                                `);
                            });
                        }, 50);
                        break;

                case 'desk':
                    if (!state.hasKey) {
                        showModal(`
                            <h3>抽屜</h3>

        // ============================================================
        //  密碼鎖通用函數
        // ============================================================

        function initPasswordLock(lockId, numpadId, correctPassword, onSuccess, length = 4) {
            const lockEl = $(lockId);
            const numpadEl = $(numpadId);
            if (!lockEl || !numpadEl) {
                console.error('找不到密碼鎖或鍵盤元素:', lockId, numpadId);
                return;
            }

            let input = [];
            const slots = lockEl.querySelectorAll('.password-slot');

            function updateSlots() {
                slots.forEach((slot, idx) => {
                    if (idx < input.length) {
                        slot.textContent = '●';
                        slot.classList.add('filled');
                    } else {
                        slot.textContent = '';
                        slot.classList.remove('filled');
                    }
                });
            }

            // 清空並重新生成數字鍵盤
            numpadEl.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'numpad-btn';
                btn.textContent = i;
                btn.onclick = () => { 
                    if (input.length < length) { 
                        input.push(i); 
                        updateSlots(); 
                    } 
                };
                numpadEl.appendChild(btn);
            }
            
            const btnClear = document.createElement('button');
            btnClear.className = 'numpad-btn clear';
            btnClear.textContent = 'C';
            btnClear.onclick = () => { 
                input = []; 
                updateSlots(); 
            };
            numpadEl.appendChild(btnClear);

            const btn0 = document.createElement('button');
            btn0.className = 'numpad-btn';
            btn0.textContent = '0';
            btn0.onclick = () => { 
                if (input.length < length) { 
                    input.push(0); 
                    updateSlots(); 
                } 
            };
            numpadEl.appendChild(btn0);

            const btnConfirm = document.createElement('button');
            btnConfirm.className = 'numpad-btn confirm';
            btnConfirm.textContent = '✓';
            btnConfirm.onclick = () => {
                if (input.length !== length) {
                    showModal(`<h3>提示</h3><p>請輸入完整的 ${length} 位數密碼。</p><div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">知道了</button></div>`);
                    return;
                }
                const entered = input.join('');
                if (entered === correctPassword) {
                    onSuccess();
                } else {
                    showModal(`<h3>密碼錯誤</h3><p>輸入的密碼不正確，請再試一次。</p><div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">重試</button></div>`);
                    input = [];
                    updateSlots();
                }
            };
            numpadEl.appendChild(btnConfirm);
            updateSlots();
        }

                <h3>${label}發電機</h3>
                <img src="${imgSrc}" alt="${label}發電機" style="cursor:pointer;" onclick="closeModal();showGeneratorPassword('${generatorId}')" onerror="this.style.display='none'">
                <p style="font-size:13px;color:#8a8078;text-align:center;">點擊圖片輸入密碼</p>
                <div class="btn-group">
                    <button class="btn btn-yes" onclick="closeModal();showGeneratorPassword('${generatorId}')">輸入密碼</button>
                    <button class="btn btn-no" onclick="closeModal()">先不要</button>
                </div>
            `);
        }

        function showGeneratorPassword(generatorId) {
            const label = generatorLabels[generatorId] || '發電機';
            showModal(`
                <h3>${label}發電機</h3>
                <p>請輸入四位數密碼：</p>
                <div style="margin:12px 0;">
                    <div class="password-lock" id="genLock_${generatorId}">
                        <div class="password-slot" data-idx="0"></div>
                        <div class="password-slot" data-idx="1"></div>
                        <div class="password-slot" data-idx="2"></div>
                        <div class="password-slot" data-idx="3"></div>
                    </div>
                    <div class="numpad" id="genNumpad_${generatorId}"></div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-close" onclick="closeModal()">取消</button>
                </div>
            `);
            setTimeout(() => {
                initPasswordLock(`genLock_${generatorId}`, `genNumpad_${generatorId}`, state.generatorPassword, () => {
                    state.generatorUnlocked = true;
                    closeModal();
                    showLightChoice();
                });
            }, 50);
        }

        // ============================================================
        //  開燈／不開燈
        // ============================================================

        function showLightChoice() {
            showModal(`
                <h3>發電機啟動了</h3>
                <p>你面前有兩個選擇：</p>
                <div class="choice-group">
                    <button class="choice-btn choice-light" onclick="chooseLight('light')">按下開關</button>
                    <button class="choice-btn choice-dark" onclick="chooseLight('dark')">不按開關</button>
                </div>
            `);
        }

        function chooseLight(choice) {
            closeModal();
            state.finalChoice = choice;

            // ===== 鈴鐺警告（不管開不開燈） =====
            if (state.hasBell) {
                showModal(`
                    <h3>鈴鐺聲</h3>
                    <p>你身上的鈴鐺發出了清脆的聲響...</p>
                    <p style="color:#f0a070;">對聲音極度敏感的第二人格哈爾沃森，正在快速醒來！</p>
                    <p>你必須在 <span style="color:#f0e4c0;font-weight:600;">10 分鐘</span> 內逃出去！</p>
                    <div class="btn-group"><button class="btn btn-yes" onclick="closeModal();continueChooseLight('${choice}')">我知道了！</button></div>
                `);
                return;
            }
            
            // 沒有鈴鐺，直接繼續
            continueChooseLight(choice);
        }

        function continueChooseLight(choice) {
            // 停止總計時器
            if (state.totalTimerInterval) {
                clearInterval(state.totalTimerInterval);
                state.totalTimerInterval = null;
                state.totalTimerRunning = false;
            }
            const oldTimer = document.getElementById('totalTimerDisplay');
            if (oldTimer) oldTimer.remove();

            if (choice === 'light') {
                if (state.hasCloth) {
                    showModal(`
                        <h3>燈亮了！</h3>
                        <p>第二人格哈爾沃森提著刀衝進來！</p>
                        <p>你抓起<span style="color:#f0e4c0;font-weight:600;">${state.clothType}</span>朝他蓋過去！</p>
                        <p>他被布料纏住，動彈不得。</p>
                        <p style="color:#f0e4c0;">由於突然變黑，主人格Eric趁著這個空檔短暫奪回身體控制權，對你大喊：</p>
                        <p style="font-weight:600;font-size:18px;color:#f0a070;">「快跑！去大門！他鎖住了！需要密碼！」</p>
                        <div class="btn-group"><button class="btn btn-yes" onclick="closeModal();goToDoor()">衝向大門！</button></div>
                    `);
                } else {
                    showEnding('bad', '你伸手去抓——什麼都沒有。他舉起刀……你修長的雙腿被奪走了。');
                }
            } else {
                showModal(`
                    <h3>黑暗之中</h3>
                    <p>門被輕輕推開，一個顫抖的聲音說：</p>
                    <p style="font-weight:600;font-size:18px;color:#f0e4c0;">「快……我帶你出去。」</p>
                    <p>主人格Eric出現了。他拉著你往大門跑去。</p>
                    <p>但到了門口，他臉色一變——</p>
                    <p style="color:#f0a070;">「該死……他把門鎖換了。需要密碼才能出去。快輸入！」</p>
                    <div class="btn-group"><button class="btn btn-yes" onclick="closeModal();goToDoor()">輸入密碼</button></div>
                `);
            }
        }

        // ============================================================
        //  大門場景
        // ============================================================

        function goToDoor() {
            state.scene = 'door';
            renderDoorScene();
        }

        function renderDoorScene() {
            gameScene.style.backgroundImage = "url('scene_final_door.jpg')";
            gameScene.style.backgroundSize = 'cover';
            gameScene.style.backgroundPosition = 'center';

            document.querySelectorAll('.clickable').forEach(el => el.remove());
            document.querySelectorAll('.scene-nav').forEach(el => el.remove());

            // 密碼提示
            const hintEl = document.createElement('div');
            hintEl.style.cssText = `
                position:absolute; left:50%; top:12%; transform:translateX(-50%);
                z-index:5; text-align:center;
                font-size:20px; color:#f0e4c0;
                background:rgba(0,0,0,0.5); padding:12px 24px; border-radius:8px;
                border:1px solid rgba(180,160,130,0.2);
                font-family: 'Cinzel', serif;
                letter-spacing: 2px;
            `;
            hintEl.textContent = 'Erik Halvorsen（E.H.）';
            gameScene.appendChild(hintEl);

            // 密碼輸入
            const inputArea = document.createElement('div');
            inputArea.style.cssText = `
                position:absolute; left:50%; bottom:22%; transform:translateX(-50%);
                z-index:10; text-align:center;
                background:rgba(0,0,0,0.6); padding:20px 30px; border-radius:16px;
                border:1px solid rgba(180,160,130,0.15);
            `;
            inputArea.innerHTML = `
                <div style="display:flex;gap:12px;justify-content:center;margin-bottom:12px;">
                    <div class="password-slot" id="doorSlot0"></div>
                    <div class="password-slot" id="doorSlot1"></div>
                    <div class="password-slot" id="doorSlot2"></div>
                    <div class="password-slot" id="doorSlot3"></div>
                </div>
                <div class="numpad" id="doorNumpad"></div>
                <div style="margin-top:12px;font-size:13px;color:#8a8078;">請輸入四位數密碼</div>
            `;
            gameScene.appendChild(inputArea);

            // 計時器
            const timerEl = document.createElement('div');
            timerEl.className = 'timer';
            timerEl.id = 'doorTimer';
            timerEl.style.cssText = 'position:absolute;top:20px;right:20px;z-index:10;';
            timerEl.textContent = '15:00';
            gameScene.appendChild(timerEl);

            // 如果有鈴鐺，時間縮短為 6 分鐘
            if (state.hasBell) {
                const warnEl = document.createElement('div');
                warnEl.className = 'bell-warning';
                warnEl.style.cssText = 'position:absolute;bottom:15%;left:50%;transform:translateX(-50%);z-index:10;';
                warnEl.innerHTML = `
                    <span class="bell-icon">🔔</span>
                    <span class="bell-text">鈴鐺聲暴露了你的位置並且驚動了第二人格哈爾沃森！時間縮短為 10 分鐘！</span>
                `;
                gameScene.appendChild(warnEl);
                state.timer = 600;
                timerEl.textContent = '10:00';
            } else {
                state.timer = 900;
            }
            startDoorTimer();

            let doorInput = [];

            function updateDoorSlots() {
                const slots = [
                    document.getElementById('doorSlot0'),
                    document.getElementById('doorSlot1'),
                    document.getElementById('doorSlot2'),
                    document.getElementById('doorSlot3')
                ];
                slots.forEach((slot, idx) => {
                    if (idx < doorInput.length) {
                        slot.textContent = '●';
                        slot.classList.add('filled');
                    } else {
                        slot.textContent = '';
                        slot.classList.remove('filled');
                    }
                });
            }

            const numpadEl = document.getElementById('doorNumpad');
            if (numpadEl) {
                numpadEl.innerHTML = '';
                for (let i = 1; i <= 9; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'numpad-btn';
                    btn.textContent = i;
                    btn.onclick = () => { if (doorInput.length < 4) { doorInput.push(i);
                            updateDoorSlots(); } };
                    numpadEl.appendChild(btn);
                }
                const btnClear = document.createElement('button');
                btnClear.className = 'numpad-btn clear';
                btnClear.textContent = 'C';
                btnClear.onclick = () => { doorInput = [];
                    updateDoorSlots(); };
                numpadEl.appendChild(btnClear);

                const btn0 = document.createElement('button');
                btn0.className = 'numpad-btn';
                btn0.textContent = '0';
                btn0.onclick = () => { if (doorInput.length < 4) { doorInput.push(0);
                        updateDoorSlots(); } };
                numpadEl.appendChild(btn0);

                const btnConfirm = document.createElement('button');
                btnConfirm.className = 'numpad-btn confirm';
                btnConfirm.textContent = '✓';
                btnConfirm.onclick = () => {
                    if (doorInput.length !== 4) return;
                    if (doorInput.join('') === '2579') {
                        clearInterval(state.timerInterval);
                        state.timerRunning = false;
                        if (state.finalChoice === 'dark') showEnding('super');
                        else showEnding('good');
                    } else {
                        showModal(`<h3>密碼錯誤</h3><p>輸入的密碼不正確，請再試一次。</p><div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">重試</button></div>`);
                        doorInput = [];
                        updateDoorSlots();
                    }
                };
                numpadEl.appendChild(btnConfirm);
            }

            const backBtn = document.createElement('div');
            backBtn.className = 'scene-nav';
            backBtn.style.cssText =
                'position:absolute;top:20px;left:20px;z-index:10;cursor:pointer;opacity:0.5;transition:opacity 0.3s;';
            backBtn.innerHTML = `
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <rect x="2" y="2" width="36" height="36" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
                    <path d="M22 14 L14 20 L22 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
            backBtn.onmouseenter = () => backBtn.style.opacity = '1';
            backBtn.onmouseleave = () => backBtn.style.opacity = '0.5';
            backBtn.onclick = () => {
                if (confirm('確定要放棄大門逃脫嗎？')) {
                    showEnding('bad', '你放棄了逃脫的機會……');
                }
            };
            gameScene.appendChild(backBtn);
        }

        // ============================================================
        //  計時器
        // ============================================================

        function startDoorTimer() {
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerRunning = true;
            state.timerInterval = setInterval(() => {
                state.timer--;
                const timerEl = document.getElementById('doorTimer');
                if (timerEl) {
                    const mins = Math.floor(state.timer / 60);
                    const secs = state.timer % 60;
                    timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    if (state.timer <= 60) timerEl.classList.add('warning');
                }
                if (state.timer <= 0) {
                    clearInterval(state.timerInterval);
                    state.timerRunning = false;
                    showEnding('bad', '時間到了……你沒能及時逃出。');
                }
            }, 1000);
        }

        // ============================================================
        //  主人格日記（4頁 - 純圖片，已修復翻頁）
        // ============================================================

        const notebookPages = [
            'obj_notebook_page1.jpg',
            'obj_notebook_page2.jpg',
            'obj_notebook_page3.jpg',
            'obj_notebook_page4.jpg'
        ];

        function showNotebookPages() {
            let currentPage = state.notebookPage || 0;

            function renderPage() {
                const imgSrc = notebookPages[currentPage];
                const total = notebookPages.length;
                showModal(`
                    <h3>Eric日記（${currentPage+1}/${total}）</h3>
                    <img src="${imgSrc}" alt="日記內頁" onerror="this.style.display='none'">
                    <div class="page-nav-group">
                        ${currentPage > 0 ? `<button class="btn btn-yes" onclick="closeModal();state.notebookPage=${currentPage-1};showNotebookPages();">◀ 上一頁</button>` : ''}
                        ${currentPage < total - 1 ? `<button class="btn btn-yes" onclick="closeModal();state.notebookPage=${currentPage+1};showNotebookPages();">下一頁 ▶</button>` : ''}
                        <button class="btn btn-no" onclick="closeModal()">關閉</button>
                    </div>
                `);
            }
            renderPage();
        }

        // ============================================================
        //  結局
        // ============================================================

        function showEnding(type, customText = '') {
            if (state.gameEnded) return;
            state.gameEnded = true;
            
            // ===== 停止所有計時器 =====
            if (state.totalTimerInterval) {
                clearInterval(state.totalTimerInterval);
                state.totalTimerInterval = null;
                state.totalTimerRunning = false;
            }
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
                state.timerRunning = false;
            }
            // 移除計時器顯示
            const oldTimer = document.getElementById('totalTimerDisplay');
            if (oldTimer) oldTimer.remove();

            const charId = state.character;

            let title = '',
                text = '';

            if (type === 'good') {
                const endings = {
                    Astrid: '門開了。艾絲特衝進雪地，橘紅長髮在風中飛揚。',
                    Elias: '門開了。艾利亞斯走出大門，月光照進綠色眼睛。',
                    Freya: '門開了。芙蕾雅走進雪地，月光灑在白皙肌膚上。',
                    Lukas: '門開了。盧卡斯踏出大門，修長的雙腿在雪地上奔跑。'
                };
                title = '好結局';
                text = endings[charId] || '你成功逃出了房子。';
            } else if (type === 'super') {
                const superEndings = {
                    Astrid: '「妳的頭髮像夕陽。快走吧。」門關上，艾絲特一個人走向黎明。',
                    Elias: '「你的眼睛像我媽媽的。」艾利亞斯走出門，嘴角微微上揚。',
                    Freya: '「妳的皮膚很美，別讓任何人拿走它。」芙蕾雅繼續往前走。',
                    Lukas: '「跑得快是好事。以後遇到危險，記得跑。」盧卡斯跑向山腳。'
                };
                title = '超級結局';
                text = superEndings[charId] || '你選擇了黑暗，主人格Eric為你打開了大門。';
            } else {
                const badEndings = {
                    Astrid: '你橘紅的頭髮被奪走，永遠成為第二人格哈爾沃森的收藏品了。',
                    Elias: '你綠色的眼睛被奪走，永遠成為第二人格哈爾沃森的收藏品了。',
                    Freya: '你白皙的肌膚被奪走，永遠成為第二人格哈爾沃森的收藏品了。',
                    Lukas: '你修長的雙腿被奪走，永遠成為第二人格哈爾沃森的收藏品了。'
                };
                title = '壞結局';
                text = customText || badEndings[charId] || '你沒能逃出這棟房子。';
            }

            showModal(`
                <h3>${title}</h3>
                <div class="ending-text">${text}</div>
                <div class="btn-group">
                    <button class="btn btn-yes" onclick="closeModal();showScreen('intro')">THE END</button>
                </div>
            `);
        }

        // ============================================================
        //  彈窗控制
        // ============================================================

        function showModal(html) {
            modalContent.innerHTML = html;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // ============================================================
        //  視窗大小變化
        // ============================================================

        window.addEventListener('resize', () => {
            if (document.getElementById('game').classList.contains('active')) {
                const currentScene = state.scene;
                if (currentScene && currentScene !== 'door') {
                    renderScene();
                } else if (currentScene === 'door') {
                    renderDoorScene();
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
        });

        console.log('🕯️ 雪夜逃脫 v1.0 已載入');
        console.log('🔑 發電機密碼：6253');
        console.log('🚪 大門密碼：2579');
        console.log('📓 日記密碼：1321');
        console.log('🗄️ 櫃子密碼：198162');
        console.log('🏚️ 倉庫密碼：3527');
        console.log('🗄️ 衣櫃密碼：2981');
    </script>
</body>
</html>
