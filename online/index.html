<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>雪夜逃脫</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+TC:wght@400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ===== 全域重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', 'Cinzel', sans-serif;
            background: #0a0e1a;
            color: #e8ddd0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* ===== 通用容器 ===== */
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .screen.active {
            display: flex;
        }

        /* ===== 首頁 ===== */
        #intro {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: url('bg_intro.jpg') center/cover no-repeat;
            position: relative;
        }
        #intro::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(10, 14, 26, 0.45);
            pointer-events: none;
        }
        #intro>* {
            position: relative;
            z-index: 1;
        }

        .game-title {
            font-family: 'Cinzel', serif;
            font-size: 72px;
            font-weight: 700;
            letter-spacing: 8px;
            background: linear-gradient(180deg, #f5edd6 0%, #c4b48a 50%, #8a7a5a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(180, 140, 80, 0.6), 0 4px 8px rgba(0, 0, 0, 0.8), 0 8px 16px rgba(0, 0, 0, 0.4);
            margin-bottom: 40px;
        }

        .btn-start {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 6px;
            padding: 18px 64px;
            border: 2px solid #d4c9a8;
            border-radius: 8px;
            background: linear-gradient(135deg, #2a2520, #1a1612);
            color: #d4c9a8;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .btn-start:hover {
            background: linear-gradient(135deg, #3d352e, #2a2520);
            box-shadow: 0 4px 40px rgba(180, 140, 80, 0.3), 0 0 60px rgba(180, 140, 80, 0.1);
            transform: scale(1.03);
            border-color: #f0e4c0;
        }

        /* ===== 角色選擇 ===== */
        #select {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #0a0e1a 0%, #141c2e 30%, #1a2a3a 60%, #0a0e1a 100%);
            padding: 40px 20px;
        }
        #select::before {
            content: '';
            position: absolute;
            top: 60px;
            right: 80px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200, 210, 230, 0.15) 0%, transparent 70%);
            box-shadow: 0 0 120px rgba(200, 210, 230, 0.08);
            pointer-events: none;
        }
        #select::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 30%;
            background: linear-gradient(180deg, transparent 0%, rgba(200, 210, 230, 0.05) 50%, rgba(200, 210, 230, 0.10) 100%);
            pointer-events: none;
        }

        .select-title {
            font-family: 'Cinzel', serif;
            font-size: 36px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #d4c9a8;
            margin-bottom: 40px;
            text-shadow: 0 0 30px rgba(180, 140, 80, 0.15);
            position: relative;
            z-index: 1;
        }

        .char-grid {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .char-card {
            width: 200px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(180, 160, 130, 0.15);
            border-radius: 16px;
            padding: 20px 16px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.35s ease;
            backdrop-filter: blur(4px);
        }
        .char-card:hover {
            transform: translateY(-8px);
            border-color: rgba(180, 160, 130, 0.4);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        .char-card img {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid rgba(180, 160, 130, 0.2);
            margin-bottom: 12px;
            background: #1a1a22;
        }

        .char-name {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            font-weight: 600;
            color: #f0e4c0;
            letter-spacing: 2px;
        }

        .char-feature {
            font-size: 14px;
            color: #b0a898;
            margin: 4px 0 6px;
        }

        .char-desc {
            font-size: 13px;
            color: #8a8078;
            line-height: 1.5;
            margin: 6px 0 10px;
            min-height: 40px;
        }

        .char-stars {
            color: #d4c9a8;
            font-size: 18px;
            letter-spacing: 2px;
        }

        /* ===== 遊戲畫面 ===== */
        #game {
            flex-direction: column;
            background: #0a0e1a;
            position: relative;
        }

        .game-scene {
            flex: 1;
            position: relative;
            background-size: cover;
            background-position: center;
            background-color: #0a0e1a;
            overflow: hidden;
        }

        /* 黑暗遮罩 + 手電筒 */
        .dark-mask {
            position: absolute;
            inset: 0;
            background: #000;
            pointer-events: none;
            /* JS 控制手電筒挖洞 */;
        }

        .game-scene.lit .dark-mask {
            display: none;
        }

        /* 場景內可點擊物件 */
        .clickable {
            position: absolute;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0);
            border-radius: 8px;
            transition: border-color 0.3s;
            min-width: 40px;
            min-height: 40px;
            z-index: 5;
        }
        .clickable:hover {
            border-color: rgba(255, 215, 140, 0.6);
            background: rgba(255, 215, 140, 0.08);
        }

        .clickable-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #d4c9a8;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 10px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .clickable:hover .clickable-label {
            opacity: 1;
        }

        /* ===== 道具欄 ===== */
        .inventory-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            padding: 14px 28px;
            background: rgba(10, 8, 6, 0.85);
            border: 1px solid rgba(180, 160, 130, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.7);
            z-index: 20;
            min-height: 80px;
            min-width: 200px;
        }
        .inventory-slot {
            width: 64px;
            height: 64px;
            border: 1px dashed rgba(180, 160, 130, 0.15);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #6a6058;
            transition: all 0.3s;
        }
        .inventory-slot.filled {
            border: 1px solid rgba(180, 160, 130, 0.3);
            background: rgba(255, 255, 255, 0.06);
        }
        .inventory-slot img {
            max-width: 48px;
            max-height: 48px;
            object-fit: contain;
        }

        /* ===== 彈窗 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: rgba(20, 18, 16, 0.95);
            border: 1px solid rgba(180, 160, 130, 0.25);
            border-radius: 20px;
            padding: 32px 40px;
            max-width: 520px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
        }
        .modal-box h3 {
            font-family: 'Cinzel', serif;
            font-size: 22px;
            color: #f0e4c0;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        .modal-box p {
            font-size: 15px;
            line-height: 1.7;
            color: #c8bdb0;
            margin-bottom: 12px;
            text-align: left;
        }
        .modal-box img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            margin: 12px 0;
            border: 1px solid rgba(180, 160, 130, 0.15);
        }
        .modal-box .btn-group {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-box .btn-group .btn {
            padding: 10px 32px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .modal-box .btn-group .btn-yes {
            background: linear-gradient(135deg, #d4c9a8, #b8a888);
            color: #1a1612;
        }
        .modal-box .btn-group .btn-yes:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 20px rgba(180, 140, 80, 0.3);
        }
        .modal-box .btn-group .btn-no {
            background: rgba(255, 255, 255, 0.08);
            color: #b0a898;
            border: 1px solid rgba(180, 160, 130, 0.2);
        }
        .modal-box .btn-group .btn-no:hover {
            background: rgba(255, 255, 255, 0.14);
        }
        .modal-box .btn-group .btn-close {
            background: rgba(180, 60, 60, 0.2);
            color: #e8a0a0;
            border: 1px solid rgba(180, 60, 60, 0.2);
        }
        .modal-box .btn-group .btn-close:hover {
            background: rgba(180, 60, 60, 0.3);
        }

        /* 密碼鎖 */
        .password-lock {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 16px 0 20px;
        }
        .password-slot {
            width: 48px;
            height: 56px;
            border-bottom: 3px solid rgba(180, 160, 130, 0.4);
            font-size: 32px;
            color: #f0e4c0;
            text-align: center;
            line-height: 56px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            transition: border-color 0.3s;
        }
        .password-slot.filled {
            border-bottom-color: #d4c9a8;
            text-shadow: 0 0 20px rgba(180, 140, 80, 0.2);
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 220px;
            margin: 0 auto 8px;
        }
        .numpad-btn {
            padding: 12px 0;
            font-size: 22px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #e8ddd0;
            cursor: pointer;
            transition: all 0.15s;
            font-family: 'Courier New', monospace;
        }
        .numpad-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.04);
        }
        .numpad-btn.confirm {
            background: rgba(180, 140, 80, 0.25);
            border-color: rgba(180, 140, 80, 0.3);
            color: #f0e4c0;
        }
        .numpad-btn.confirm:hover {
            background: rgba(180, 140, 80, 0.35);
        }
        .numpad-btn.clear {
            background: rgba(180, 60, 60, 0.15);
            border-color: rgba(180, 60, 60, 0.15);
            color: #e8a0a0;
        }
        .numpad-btn.clear:hover {
            background: rgba(180, 60, 60, 0.25);
        }

        /* 計時器 */
        .timer {
            font-family: 'Courier New', monospace;
            font-size: 40px;
            font-weight: 700;
            color: #f0e4c0;
            text-shadow: 0 0 30px rgba(180, 140, 80, 0.15);
            letter-spacing: 4px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            border: 1px solid rgba(180, 160, 130, 0.1);
            display: inline-block;
            margin-bottom: 12px;
        }
        .timer.warning {
            color: #f0a070;
            animation: timerPulse 0.8s ease-in-out infinite;
        }
        @keyframes timerPulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        .choice-group {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin: 16px 0;
            flex-wrap: wrap;
        }
        .choice-btn {
            padding: 16px 40px;
            font-size: 20px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans TC', sans-serif;
        }
        .choice-btn:hover {
            transform: scale(1.05);
        }
        .choice-light {
            background: linear-gradient(135deg, #f5b042, #d4872a);
            color: #1a1612;
            box-shadow: 0 0 40px rgba(212, 135, 42, 0.2);
        }
        .choice-light:hover {
            box-shadow: 0 0 60px rgba(212, 135, 42, 0.4);
        }
        .choice-dark {
            background: linear-gradient(135deg, #4a6a8a, #2a3a5a);
            color: #e8ddd0;
            box-shadow: 0 0 40px rgba(74, 106, 138, 0.15);
        }
        .choice-dark:hover {
            box-shadow: 0 0 60px rgba(74, 106, 138, 0.3);
        }

        /* 鈴鐺警告 */
        .bell-warning {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            background: rgba(180, 60, 30, 0.15);
            border: 1px solid rgba(180, 60, 30, 0.2);
            border-radius: 10px;
            margin: 8px 0 16px;
            justify-content: center;
            animation: bellShake 0.5s ease-in-out;
        }
        .bell-warning .bell-icon {
            font-size: 28px;
        }
        .bell-warning .bell-text {
            font-size: 14px;
            color: #f0a070;
        }
        @keyframes bellShake {
            0%,
            100% {
                transform: rotate(0deg);
            }
            25% {
                transform: rotate(-8deg);
            }
            75% {
                transform: rotate(8deg);
            }
        }

        /* 結局畫面 */
        .ending-text {
            font-size: 18px;
            line-height: 2;
            color: #d4c9a8;
            text-align: left;
            padding: 8px 0;
            white-space: pre-wrap;
        }
        .ending-text .highlight {
            color: #f0e4c0;
            font-weight: 600;
        }

        /* 場景內的方向箭頭（SVG） */
        .scene-nav {
            position: absolute;
            z-index: 10;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s, transform 0.3s;
        }
        .scene-nav:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* ===== 響應式 ===== */
        @media (max-width: 820px) {
            .game-title {
                font-size: 40px;
                letter-spacing: 4px;
            }
            .btn-start {
                font-size: 20px;
                padding: 14px 40px;
            }
            .char-grid {
                gap: 16px;
            }
            .char-card {
                width: 150px;
                padding: 14px 10px 18px;
            }
            .char-card img {
                width: 100px;
                height: 100px;
            }
            .char-name {
                font-size: 16px;
            }
            .select-title {
                font-size: 26px;
            }
            .modal-box {
                padding: 24px 20px;
                max-width: 95%;
            }
            .password-slot {
                width: 36px;
                height: 44px;
                font-size: 24px;
                line-height: 44px;
            }
            .numpad {
                max-width: 180px;
            }
            .numpad-btn {
                padding: 10px 0;
                font-size: 18px;
            }
            .inventory-bar {
                padding: 10px 16px;
                gap: 8px;
                min-height: 60px;
                bottom: 16px;
            }
            .inventory-slot {
                width: 48px;
                height: 48px;
            }
            .choice-btn {
                padding: 12px 24px;
                font-size: 16px;
            }
            .timer {
                font-size: 30px;
                padding: 6px 16px;
            }
        }

        @media (max-width: 480px) {
            .game-title {
                font-size: 28px;
                letter-spacing: 2px;
            }
            .btn-start {
                font-size: 16px;
                padding: 12px 28px;
                letter-spacing: 3px;
            }
            .char-card {
                width: 130px;
                padding: 10px 8px 14px;
            }
            .char-card img {
                width: 80px;
                height: 80px;
            }
            .char-name {
                font-size: 14px;
            }
            .char-desc {
                font-size: 11px;
                min-height: 30px;
            }
            .select-title {
                font-size: 20px;
                margin-bottom: 20px;
            }
            .char-grid {
                gap: 10px;
            }
            .modal-box h3 {
                font-size: 18px;
            }
            .modal-box p {
                font-size: 13px;
            }
            .password-slot {
                width: 30px;
                height: 38px;
                font-size: 20px;
                line-height: 38px;
            }
            .numpad {
                max-width: 150px;
                gap: 6px;
            }
            .numpad-btn {
                padding: 8px 0;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 首頁 ===== -->
    <div id="intro" class="screen active">
        <div class="game-title">雪夜逃脫</div>
        <button class="btn-start" onclick="showSelect()">開始遊戲</button>
    </div>

    <!-- ===== 角色選擇 ===== -->
    <div id="select" class="screen">
        <div class="select-title">選擇你的角色</div>
        <div class="char-grid" id="charGrid">
            <!-- 由 JS 動態產生 -->
        </div>
    </div>

    <!-- ===== 遊戲畫面 ===== -->
    <div id="game" class="screen">
        <div class="game-scene" id="gameScene">
            <!-- 黑暗遮罩（手電筒效果用 canvas 實現） -->
            <canvas id="darkCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;display:block;"></canvas>

            <!-- 可點擊物件由 JS 動態生成 -->

            <!-- 道具欄 -->
            <div class="inventory-bar" id="inventoryBar">
                <div class="inventory-slot" data-index="0"></div>
                <div class="inventory-slot" data-index="1"></div>
                <div class="inventory-slot" data-index="2"></div>
                <div class="inventory-slot" data-index="3"></div>
                <div class="inventory-slot" data-index="4"></div>
                <div class="inventory-slot" data-index="5"></div>
            </div>
        </div>
    </div>

    <!-- ===== 通用彈窗 ===== -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box" id="modalBox">
            <div id="modalContent"></div>
        </div>
    </div>


    <script>
        // ============================================================
        //  資料定義
        // ============================================================

        // 角色資料
        const CHARACTERS = {
            Astrid: {
                id: 'Astrid',
                name: '艾絲特',
                feature: '橘紅頭髮',
                desc: '活潑開朗，半夜肚子餓絕對忍不住。直覺敏銳，總能在混亂中找到出路。',
                stars: '★★★★☆',
                img: 'char_Astrid.jpg'
            },
            Elias: {
                id: 'Elias',
                name: '艾利亞斯',
                feature: '綠色眼睛',
                desc: '自信驕傲，觀察力驚人。手機手電筒壞了讓他有點煩躁——但不會承認。',
                stars: '★☆☆☆☆',
                img: 'char_Elias.jpg'
            },
            Freya: {
                id: 'Freya',
                name: '芙蕾雅',
                feature: '白皙肌膚',
                desc: '話不多，冷靜沉著，用行動代替言語。膚色在月光下像會發光。',
                stars: '★★☆☆☆',
                img: 'char_Freya.jpg'
            },
            Lukas: {
                id: 'Lukas',
                name: '盧卡斯',
                feature: '修長雙腿',
                desc: '團隊中的行動派，體能最好，總是第一個站出來保護大家。',
                stars: '★★★☆☆',
                img: 'char_Lukas.jpg'
            }
        };

        // 角色房間配置
        const ROOM_CONFIG = {
            Astrid: {
                background: 'room_bedroom.jpg',
                isLit: false,
                hasPhoneLight: false, // 需要找蠟燭
                items: [
                    { id: 'bed', label: '床', x: 20, y: 50, w: 160, h: 100, action: 'bed' },
                    { id: 'desk', label: '書桌', x: 55, y: 25, w: 120, h: 80, action: 'desk' },
                    { id: 'notebook', label: '好人格日記', x: 65, y: 35, w: 40, h: 30, action: 'notebook' },

        // ============================================================
        //  黑暗遮罩（手電筒效果）
        // ============================================================
        function setupDarkCanvas() {
            const rect = gameScene.getBoundingClientRect();
            darkCanvas.width = rect.width || window.innerWidth;
            darkCanvas.height = rect.height || window.innerHeight;

            darkCanvas.style.display = isDarkMode ? 'block' : 'none';

            if (isDarkMode) {
                gameScene.addEventListener('mousemove', onMouseMove);
                gameScene.addEventListener('mouseleave', onMouseLeave);
                drawDarkMask();
            } else {
                gameScene.removeEventListener('mousemove', onMouseMove);
                gameScene.removeEventListener('mouseleave', onMouseLeave);
            }
        }

        function onMouseMove(e) {
            const rect = gameScene.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            drawDarkMask();
        }

        function onMouseLeave() {
            mouseX = -9999;
            mouseY = -9999;
            drawDarkMask();
        }

        function drawDarkMask() {
            const w = darkCanvas.width,
                h = darkCanvas.height;
            ctx.clearRect(0, 0, w, h);

            // 全黑背景
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, w, h);

            // 如果有光源（蠟燭或手機），在滑鼠位置挖洞
            if (state.hasLight && mouseX > 0 && mouseY > 0) {
                const gradient = ctx.createRadialGradient(mouseX, mouseY, 10, mouseX, mouseY, 260);
                gradient.addColorStop(0, 'rgba(0,0,0,0)');
                gradient.addColorStop(0.4, 'rgba(0,0,0,0.1)');
                gradient.addColorStop(0.7, 'rgba(0,0,0,0.5)');
                gradient.addColorStop(1, 'rgba(0,0,0,0.95)');
                ctx.globalCompositeOperation = 'destination-out';
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(mouseX, mouseY, 260, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            } else if (!state.hasLight) {
                // 完全黑暗
            }
        }

        // ============================================================
        //  場景渲染
        // ============================================================
        function renderScene() {
            const cfg = getCurrentConfig();
            if (!cfg) return;

            // 設定背景
            gameScene.style.backgroundImage = `url('${cfg.background}')`;
            gameScene.style.backgroundSize = 'cover';
            gameScene.style.backgroundPosition = 'center';

            // 清除舊的 clickable
            document.querySelectorAll('.clickable').forEach(el => el.remove());
            document.querySelectorAll('.scene-nav').forEach(el => el.remove());

            // 根據場景放置 clickable
            const rect = gameScene.getBoundingClientRect();
            const w = rect.width || window.innerWidth;
            const h = rect.height || window.innerHeight;

            cfg.items.forEach(item => {
                const el = document.createElement('div');
                el.className = 'clickable';
                el.style.left = (item.x / 100 * w) + 'px';
                el.style.top = (item.y / 100 * h) + 'px';
                el.style.width = (item.w / 100 * w) + 'px';
                el.style.height = (item.h / 100 * h) + 'px';
                el.dataset.action = item.action;
                el.innerHTML = `<span class="clickable-label">${item.label}</span>`;
                el.onclick = () => handleClick(item.action);
                gameScene.appendChild(el);
            });

            // 返回按鈕 (SVG)
            const backBtn = document.createElement('div');
            backBtn.className = 'scene-nav';
            backBtn.style.cssText =
                'position:absolute;top:20px;left:20px;z-index:10;cursor:pointer;opacity:0.6;transition:opacity 0.3s;';
            backBtn.innerHTML = `
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <rect x="2" y="2" width="36" height="36" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                    <path d="M22 14 L14 20 L22 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
            backBtn.onmouseenter = () => backBtn.style.opacity = '1';
            backBtn.onmouseleave = () => backBtn.style.opacity = '0.6';
            backBtn.onclick = () => {
                if (state.sceneHistory.length > 0) {
                    const prev = state.sceneHistory.pop();
                    state.scene = prev;
                    renderScene();
                    updateInventory();
                } else {
                    // 回到角色選擇
                    if (confirm('確定要退出遊戲嗎？進度將遺失。')) {
                        showScreen('select');
                    }
                }
            };
            gameScene.appendChild(backBtn);

            // 更新黑暗遮罩
            const cfg2 = getCurrentConfig();
            if (cfg2 && cfg2.hasPhoneLight) {
                state.hasLight = true;
                isDarkMode = false;
                darkCanvas.style.display = 'none';
            } else if (state.hasCandle) {
                state.hasLight = true;
                isDarkMode = true;
                darkCanvas.style.display = 'block';
                setupDarkCanvas();
            } else {
                isDarkMode = true;
                darkCanvas.style.display = 'block';
                setupDarkCanvas();
            }

            // 如果場景是亮的（浴室）
            if (cfg2 && cfg2.isLit) {
                isDarkMode = false;
                darkCanvas.style.display = 'none';
                state.hasLight = true;
            }

            updateInventory();
        }

        // ============================================================
        //  密碼鎖通用函數
        // ============================================================
        function initPasswordLock(lockId, numpadId, correctPassword, onSuccess, length = 4) {
            const lockEl = $(lockId);
            const numpadEl = $(numpadId);
            if (!lockEl || !numpadEl) return;

            let input = [];

            // 渲染密碼槽
            const slots = lockEl.querySelectorAll('.password-slot');
            slots.forEach((slot, idx) => {
                slot.textContent = '';
                slot.classList.remove('filled');
            });

            // 渲染數字鍵盤
            numpadEl.innerHTML = '';
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'numpad-btn';
                btn.textContent = i;
                btn.onclick = () => pressNum(i);
                numpadEl.appendChild(btn);
            }
            const btnClear = document.createElement('button');
            btnClear.className = 'numpad-btn clear';
            btnClear.textContent = 'C';
            btnClear.onclick = () => clearNum();
            numpadEl.appendChild(btnClear);

            const btn0 = document.createElement('button');
            btn0.className = 'numpad-btn';
            btn0.textContent = '0';
            btn0.onclick = () => pressNum(0);
            numpadEl.appendChild(btn0);

            const btnConfirm = document.createElement('button');
            btnConfirm.className = 'numpad-btn confirm';
            btnConfirm.textContent = '✓';
            btnConfirm.onclick = () => confirmNum();
            numpadEl.appendChild(btnConfirm);

            function pressNum(num) {
                if (input.length >= length) return;
                input.push(num);
                updateSlots();
            }

            function clearNum() {
                input = [];
                updateSlots();
            }

            function confirmNum() {
                if (input.length !== length) return;
                const entered = input.join('');
                if (entered === correctPassword) {
                    onSuccess();
                } else {
                    showModal(`<h3>密碼錯誤</h3><p>輸入的密碼不正確，請再試一次。</p><div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">重試</button></div>`);
                    input = [];
                    updateSlots();
                }
            }

            function updateSlots() {
                const slots2 = lockEl.querySelectorAll('.password-slot');
                slots2.forEach((slot, idx) => {
                    if (idx < input.length) {
                        slot.textContent = '●';
                        slot.classList.add('filled');
                    } else {
                        slot.textContent = '';
                        slot.classList.remove('filled');
                    }
                });
            }
        }

                slots.forEach((slot, idx) => {
                    if (idx < doorInput.length) {
                        slot.textContent = '●';
                        slot.classList.add('filled');
                    } else {
                        slot.textContent = '';
                        slot.classList.remove('filled');
                    }
                });
            }

            // 渲染數字鍵盤
            const numpadEl = document.getElementById('doorNumpad');
            if (numpadEl) {
                numpadEl.innerHTML = '';
                for (let i = 1; i <= 9; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'numpad-btn';
                    btn.textContent = i;
                    btn.onclick = () => {
                        if (doorInput.length >= 2) return;
                        doorInput.push(i);
                        updateDoorSlots();
                    };
                    numpadEl.appendChild(btn);
                }
                const btnClear = document.createElement('button');
                btnClear.className = 'numpad-btn clear';
                btnClear.textContent = 'C';
                btnClear.onclick = () => {
                    doorInput = [];
                    updateDoorSlots();
                };
                numpadEl.appendChild(btnClear);

                const btn0 = document.createElement('button');
                btn0.className = 'numpad-btn';
                btn0.textContent = '0';
                btn0.onclick = () => {
                    if (doorInput.length >= 2) return;
                    doorInput.push(0);
                    updateDoorSlots();
                };
                numpadEl.appendChild(btn0);

                const btnConfirm = document.createElement('button');
                btnConfirm.className = 'numpad-btn confirm';
                btnConfirm.textContent = '✓';
                btnConfirm.onclick = () => {
                    if (doorInput.length !== 2) return;
                    const entered = doorInput.join('');
                    if (entered === '29') {
                        // 密碼正確
                        clearInterval(state.timerInterval);
                        state.timerRunning = false;
                        const isSuper = (state.finalChoice === 'dark');
                        if (isSuper) {
                            showEnding('super');
                        } else {
                            showEnding('good');
                        }
                    } else {
                        showModal(`<h3>密碼錯誤</h3><p>輸入的密碼不正確，請再試一次。</p><div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">重試</button></div>`);
                        doorInput = [];
                        updateDoorSlots();
                    }
                };
                numpadEl.appendChild(btnConfirm);
            }

            // 如果有鈴鐺，顯示警告
            if (state.hasBell) {
                const warnEl = document.createElement('div');
                warnEl.className = 'bell-warning';
                warnEl.style.cssText = 'position:absolute;bottom:20%;left:50%;transform:translateX(-50%);z-index:10;';
                warnEl.innerHTML = `
                    <span class="bell-icon">🔔</span>
                    <span class="bell-text">鈴鐺聲暴露了你的位置！時間縮短為 6 分鐘！</span>
                `;
                gameScene.appendChild(warnEl);
                // 計時器改為6分鐘
                clearInterval(state.timerInterval);
                state.timer = 360;
                const timerEl2 = document.getElementById('doorTimer');
                if (timerEl2) timerEl2.textContent = '6:00';
                startDoorTimer();
            }

            // 返回按鈕（回到場景）
            const backBtn = document.createElement('div');
            backBtn.className = 'scene-nav';
            backBtn.style.cssText =
                'position:absolute;top:20px;left:20px;z-index:10;cursor:pointer;opacity:0.6;transition:opacity 0.3s;';
            backBtn.innerHTML = `
                <svg width="40" height="40" viewBox="0 0 40 40">
                    <rect x="2" y="2" width="36" height="36" rx="8" fill="rgba(0,0,0,0.6)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                    <path d="M22 14 L14 20 L22 26" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            `;
            backBtn.onmouseenter = () => backBtn.style.opacity = '1';
            backBtn.onmouseleave = () => backBtn.style.opacity = '0.6';
            backBtn.onclick = () => {
                if (confirm('確定要放棄大門逃脫嗎？')) {
                    showEnding('bad', '你放棄了逃脫的機會……');
                }
            };
            gameScene.appendChild(backBtn);

            // 更新道具欄
            updateInventory();
        }

        // ============================================================
        //  計時器
        // ============================================================
        function startDoorTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            state.timerRunning = true;
            state.timerInterval = setInterval(() => {
                state.timer--;
                const timerEl = document.getElementById('doorTimer');
                if (timerEl) {
                    const mins = Math.floor(state.timer / 60);
                    const secs = state.timer % 60;
                    timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                    if (state.timer <= 60) {
                        timerEl.classList.add('warning');
                    }
                }

                if (state.timer <= 0) {
                    clearInterval(state.timerInterval);
                    state.timerRunning = false;
                    showEnding('bad', '時間到了……你沒能及時逃出。');
                }
            }, 1000);
        }

        // ============================================================
        //  好人格日記（4頁）
        // ============================================================
        function showNotebookPages() {
            let currentPage = 0;
            const pages = [
                {
                    img: 'obj_notebook_page1.jpg',
                    text: '第一天\n\n他又在看著那四個人了。\n我知道他在想什麼——他想要他們的頭髮、眼睛、皮膚和腿。\n我阻止不了他，但我可以在黑暗中醒來。\n只要他們不開燈……'
                },
                {
                    img: 'obj_notebook_page2.jpg',
                    text: '第三天\n\n他已經觀察他們很久了。\n橘紅頭髮的女孩、綠色眼睛的男孩、白皙肌膚的女孩、修長雙腿的男孩。\n他稱他們為「材料」。\n我稱他們為……人。'
                },
                {
                    img: 'obj_notebook_page3.jpg',
                    text: '第五天\n\n今晚就是計畫實施的日子。\n他準備了雪崩、輪胎故障，還有那棟該死的房子。\n我只能死撐著不睡覺，祈禱自己能撐過今晚。\n拜託，不要讓他們按開燈……'
                },
                {
                    img: 'obj_notebook_page4.jpg',
                    text: '最後一頁\n\n如果他們逃出去了，請記住：\n這棟屋子的主人出生於 1929 年。\n大門密碼是年份的最後兩位數。\n\n（角落寫著：29）'
                }
            ];

            function renderPage() {
                const p = pages[currentPage];
                showModal(`
                    <h3>好人格日記（${currentPage+1}/${pages.length}）</h3>
                    <img src="${p.img}" alt="日記內頁" onerror="this.style.display='none'">
                    <p style="white-space:pre-wrap;font-size:14px;line-height:1.8;text-align:left;">${p.text}</p>
                    <div class="btn-group">
                        ${currentPage > 0 ? `<button class="btn btn-yes" onclick="closeModal();currentPage--;renderPage();">上一頁</button>` : ''}
                        ${currentPage < pages.length - 1 ? `<button class="btn btn-yes" onclick="closeModal();currentPage++;renderPage();">下一頁</button>` : ''}
                        ${currentPage === pages.length - 1 ? `<button class="btn btn-yes" onclick="closeModal();showDoorHint('Astrid')">記下密碼</button>` : ''}
                        <button class="btn btn-no" onclick="closeModal()">關閉</button>
                    </div>
                `);
            }

            // 將 renderPage 暴露到全域
            window.currentPage = currentPage;
            window.renderPage = renderPage;
            renderPage();
        }

        // ============================================================
        //  大門密碼提示（艾絲特／芙蕾雅用）
        // ============================================================
        function showDoorHint(charId) {
            showModal(`
                <h3>大門密碼提示</h3>
                <p style="font-size:18px;text-align:center;color:#f0e4c0;">
                    主人出生年份的最後兩位數
                </p>
                <p style="font-size:32px;text-align:center;font-weight:700;color:#f5edd6;margin:8px 0;">
                    29
                </p>
                <p style="font-size:13px;color:#8a8078;text-align:center;">記住這個數字，前往大門時需要輸入。</p>
                <div class="btn-group"><button class="btn btn-yes" onclick="closeModal()">記住了</button></div>
            `);
        }

        // ============================================================
        //  結局
        // ============================================================
        function showEnding(type, customText = '') {
            if (state.gameEnded) return;
            state.gameEnded = true;
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }

            const charId = state.character;
            const name = CHARACTERS[charId] ? CHARACTERS[charId].name : '你';

            let title = '';
            let text = '';

            if (type === 'good') {
                const endings = {
                    Astrid: '門開了。艾絲特衝進雪地，橘紅長髮在風中飛揚。她一個人跑向黎明——活著。',
                    Elias: '門開了。艾利亞斯走出大門，月光照進綠色眼睛。他一個人，但自由。',
                    Freya: '門開了。芙蕾雅走進雪地，月光灑在白皙肌膚上。她一個人，但平靜。',
                    Lukas: '門開了。盧卡斯用修長的雙腿跑進雪地。他一個人，但勇敢。'
                };
                title = '🌟 好結局';
                text = endings[charId] || '你成功逃出了房子。';
            } else if (type === 'super') {
                const superEndings = {
                    Astrid: '「妳的頭髮像夕陽。快走吧。」門關上，艾絲特一個人走向黎明。',
                    Elias: '「你的眼睛像我媽媽的。」艾利亞斯走出門，嘴角微微上揚。',
                    Freya: '「妳的皮膚很美，別讓任何人拿走它。」芙蕾雅繼續往前走。',
                    Lukas: '「跑得快是好事。以後遇到危險，記得跑。」盧卡斯跑向山腳。'
                };
                title = '🌙 超級結局';
                text = superEndings[charId] || '你選擇了黑暗，好人格為你打開了大門。';
            } else {
                // bad
                const badEndings = {
                    Astrid: '密碼錯誤。燈亮了——她看到自己的橘紅頭髮被剪下放在托盤上。',
                    Elias: '時間到了。那人拿著綠色隱形眼鏡晃了晃：「完美的顏色。」',
                    Freya: '警報響起。冰冷的手貼上她的臉頰——「皮膚移植示意圖」在燈下發亮。',
                    Lukas: '時間到了。牆上照片標註著「目標確認：盧卡斯」。'
                };
                title = '💀 壞結局';
                text = customText || badEndings[charId] || '你沒能逃出這棟房子。';
            }

            showModal(`
                <h3>${title}</h3>
                <div class="ending-text">${text}</div>
                <div class="btn-group">
                    <button class="btn btn-yes" onclick="closeModal();showScreen('select')">重新選擇角色</button>
                    <button class="btn btn-no" onclick="closeModal();showScreen('intro')">回到首頁</button>
                </div>
            `);
        }

        // ============================================================
        //  彈窗控制
        // ============================================================
        function showModal(html) {
            modalContent.innerHTML = html;
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        // 點擊外部關閉
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // ============================================================
        //  道具欄更新
        // ============================================================
        function updateInventory() {
            const slots = inventoryBar.querySelectorAll('.inventory-slot');
            const items = state.inventory;

            // 自訂道具顯示名稱
            const displayNames = {
                '床單': '🛏️',
                '浴巾': '🧣',
                '抹布': '🧽',
                '防水布': '🔵',
                '鈴鐺': '🔔',
                '蠟燭': '🕯️',
                '鑰匙': '🔑'
            };

            slots.forEach((slot, idx) => {
                if (idx < items.length) {
                    const item = items[idx];
                    const icon = displayNames[item] || '📦';
                    slot.innerHTML = `<span style="font-size:28px;">${icon}</span><div style="font-size:10px;color:#8a8078;margin-top:2px;">${item}</div>`;
                    slot.className = 'inventory-slot filled';
                } else {
                    slot.innerHTML = '';
                    slot.className = 'inventory-slot';
                }
            });
        }

        // ============================================================
        //  視窗大小變化
        // ============================================================
        window.addEventListener('resize', () => {
            if (gameScreen.classList.contains('active')) {
                setupDarkCanvas();
                // 重新渲染場景（保持當前場景）
                const currentScene = state.scene;
                if (currentScene && currentScene !== 'door') {
                    renderScene();
                } else if (currentScene === 'door') {
                    renderDoorScene();
                }
            }
        });

        // ============================================================
        //  鍵盤快捷
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (modal.classList.contains('active')) {
                    closeModal();
                }
            }
        });

        // ============================================================
        //  初始化
        // ============================================================
        console.log('🕯️ 雪夜逃脫已載入');
        console.log('📖 角色可選：', Object.keys(CHARACTERS).join(', '));
        console.log('🔑 發電機密碼：6253（由盧卡斯發現）');
        console.log('🚪 大門密碼：29');
        console.log('📓 日記／手術筆記密碼：1321');
        console.log('🗄️ 櫃子密碼：198162');
        console.log('🏚️ 倉庫密碼：3527');
        console.log('💡 選擇開燈需要布類道具才能存活！');
    </script>
</body>
